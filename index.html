<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-app-wrapper">
    <div class="weather-app">
      
      <form id="search-form" class="search-form">
        <input type="search" placeholder="Введіть місто..." autofocus="on" autocomplete="off" id="city-input" class="form-control" />
        <button type="submit" class="search-button">Пошук</button>
      </form>

      <div class="overview">
        <h1 id="city">Київ</h1>
        <ul>
          <li>Останнє оновлення: <span id="date">Вівторок 10:00</span></li>
          <li id="description">Хмарно з проясненнями</li>
        </ul>
      </div>

      <div class="row">
        <div class="current-temperature-container">
          <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Погода" id="icon" class="weather-icon" />
          <strong id="temperature">19</strong><span class="units">°C</span>
        </div>
        <div class="weather-details">
          <ul>
            <li>Вологість: <span id="humidity">65</span>%</li>
            <li>Вітер: <span id="wind">2.68</span> км/год</li>
          </ul>
        </div>
      </div>

    </div>
    
    <footer>
      Цей проєкт був створений <a href="#" target="_blank" rel="noopener noreferrer">Nelia Pryimak</a>, є 
      <a href="https://github.com/ВАШ_ДDirect_ПОСИЛАННЯ" target="_blank" rel="noopener noreferrer">відкритим кодом на GitHub</a> 
      та розміщений на <a href="https://www.netlify.com/" target="_blank" rel="noopener noreferrer">Netlify</a>.
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
